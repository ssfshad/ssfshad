<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="Plant Recognition">
<defs><style>@font-face{font-family:'PB';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'MO';src:url(data:font/woff;base64,) format('woff');}</style><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="cd" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1B2834"/></pattern>
<radialGradient id="cg" cx="78%" cy="40%" r="60%"><stop offset="0" stop-color="#9FD9B9" stop-opacity=".22"/><stop offset="1" stop-color="#06080B" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect width="480" height="250" rx="16"/></clipPath></defs>
<g clip-path="url(#cc)">
<rect width="480" height="250" fill="#06080B"/><rect width="480" height="250" fill="url(#cd)" opacity=".7"/>
<rect width="480" height="250" fill="url(#cg)"/>
<g transform="translate(14 -26)">
<path d="M300 190 C 300 120, 360 70, 440 66 C 436 150, 380 196, 300 190 Z" fill="#0A0F15" stroke="#A9CCE8" stroke-width="2" opacity=".95"/>
<path d="M300 190 Q 360 140 430 74 M340 160 L 352 128 M370 132 L 392 124 M330 172 L 362 170 M362 144 L 380 150" stroke="#A9CCE8" stroke-width="1.4" fill="none" opacity=".6"/>
<rect x="285" y="60" width="170" height="2" fill="#BFB3EE" opacity=".9" filter="url(#soft)"><animate attributeName="y" values="60;196;60" dur="3.6s" repeatCount="indefinite"/></rect>
<text x="372" y="222" text-anchor="middle" font-family="MO" font-size="11" fill="#D3E6F6">leaf.jpg → species</text></g>
</g>
<rect x=".5" y=".5" width="479" height="249" rx="16" fill="none" stroke="#1B2834"/>
<text x="26" y="40" font-family="MO" font-size="12" fill="#6F8597" letter-spacing="1">COMPUTER VISION · PYTHON</text>
<text x="24" y="220" font-family="PB" font-size="30" fill="#EEF4F9" letter-spacing="-.5">Plant Recognition</text>

</svg>