</style>
<linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="442" x2="1000"><stop offset="0" stop-color="#A9CCE8" stop-opacity=".8"/><stop offset="1" stop-color="#A9CCE8" stop-opacity="0"/></linearGradient></defs>
