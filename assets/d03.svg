<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 86" width="1000" height="86" role="img" aria-label="Things I&#x27;ve built">
<defs><style>@font-face{font-family:'MO';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'LI';src:url(data:font/woff;base64,) format('woff');}
.r{opacity:0;animation:rise .8s ease forwards}
