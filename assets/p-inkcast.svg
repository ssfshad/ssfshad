<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="InkCast">
<defs><style>@font-face{font-family:'PB';src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'MO';src:url(data:font/woff;base64,) format('woff');}.ink{stroke-dasharray:420;stroke-dashoffset:420;animation:ink 3.2s ease-in-out infinite}
@keyframes ink{0%{stroke-dashoffset:420}70%,100%{stroke-dashoffset:0}}
.ink2{stroke-dasharray:40;stroke-dashoffset:40;animation:ink2 3.2s ease-in-out infinite}
@keyframes ink2{0%,70%{stroke-dashoffset:40}90%,100%{stroke-dashoffset:0}}</style><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="cd" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1B2834"/></pattern>
<radialGradient id="cg" cx="78%" cy="40%" r="60%"><stop offset="0" stop-color="#BFB3EE" stop-opacity=".22"/><stop offset="1" stop-color="#06080B" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect width="480" height="250" rx="16"/></clipPath></defs>
<g clip-path="url(#cc)">
<rect width="480" height="250" fill="#06080B"/><rect width="480" height="250" fill="url(#cd)" opacity=".7"/>
<rect width="480" height="250" fill="url(#cg)"/>

<rect x="232" y="56" width="226" height="150" rx="14" fill="#0A0F15" stroke="#1B2834"/>
<path class="ink" d="M250 170 C 270 90, 330 80, 345 130 S 410 190, 440 100" fill="none" stroke="#A9CCE8" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
<path class="ink2" d="M262 186 L 300 186" fill="none" stroke="#BFB3EE" stroke-width="4" stroke-linecap="round"/>
<circle r="6" fill="#EEF4F9"><animateMotion dur="3.2s" repeatCount="indefinite" path="M250 170 C 270 90, 330 80, 345 130 S 410 190, 440 100" keyPoints="0;1;1" keyTimes="0;.7;1" calcMode="linear"/></circle>
</g>
<rect x=".5" y=".5" width="479" height="249" rx="16" fill="none" stroke="#1B2834"/>
<text x="26" y="40" font-family="MO" font-size="12" fill="#6F8597" letter-spacing="1">TABLET → WINDOWS · LIVE INK</text>
<text x="24" y="220" font-family="PB" font-size="36" fill="#EEF4F9" letter-spacing="-.5">InkCast</text>

</svg>