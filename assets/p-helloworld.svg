<tspan x="258" y="88" fill="#A9CCE8">day 01</tspan><tspan x="310" y="88" opacity=".7">print("hello")</tspan>
<tspan x="258" y="112" fill="#A9CCE8">day 02</tspan><tspan x="310" y="112" opacity=".7">for i in range</tspan>
<tspan x="258" y="136" fill="#A9CCE8">day 03</tspan><tspan x="310" y="136" opacity=".7">def learn():</tspan>
<tspan x="258" y="160" fill="#A9CCE8">day 04</tspan><tspan x="310" y="160" opacity=".7">streak +1</tspan></text>
<rect x="258" y="172" width="0" height="6" rx="3" fill="#A9CCE8"><animate attributeName="width" values="0;174;174" keyTimes="0;.8;1" dur="4s" repeatCount="indefinite"/></rect>
